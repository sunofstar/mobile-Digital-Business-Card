<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>한장 · 모바일 명함</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{--ink:#18202F;--bg:#EEF0F4;--line:#DCE0E8;--mute:#667085}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 "Pretendard Variable",Pretendard,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;border-radius:12px}
button:disabled{opacity:.5;cursor:not-allowed}
button:focus-visible,input:focus-visible,textarea:focus-visible,a:focus-visible,label:focus-within{outline:3px solid #F59E0B;outline-offset:2px}
.hide{display:none!important}
.wrap{max-width:440px;margin:0 auto;padding:20px 16px 48px}
h1{font-size:1.7rem;font-weight:800;margin:8px 0 2px}
.sub{color:var(--mute);margin:0 0 20px}
.box{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:16px}
.f{display:block;width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;margin-bottom:10px}
.f[readonly]{background:#F3F4F7;color:var(--mute)}
label{display:block;font-size:.85rem;color:var(--mute);margin:0 0 4px}
.btn{width:100%;padding:13px;background:var(--ink);color:#fff;font-weight:700}
.btn.alt{background:#fff;color:var(--ink);border:1px solid var(--line)}
a.btn,label.btn{display:block;text-align:center;text-decoration:none;cursor:pointer;margin:0;font-size:inherit;color:var(--ink)}
.link{background:none;color:var(--mute);text-decoration:underline;width:100%;padding:10px}
.err{color:#b3261e;min-height:1.4em;font-size:.9rem;margin:4px 0 8px}
.hint{color:var(--mute);font-size:.85rem;margin:10px 0 0}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.who{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:16px;font-size:.9rem}
.who b{color:#1b7a4b;word-break:break-all}
.who button{background:none;color:var(--mute);text-decoration:underline;padding:4px;flex:none}
.sw{display:flex;gap:10px;margin:0 0 16px}
.sw button{width:34px;height:34px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 1px var(--line)}
.sw button.on{box-shadow:0 0 0 3px var(--ink)}
.card{background:#fff;border-radius:22px;overflow:hidden;box-shadow:0 8px 30px rgba(24,32,47,.12)}
.band{height:92px}
.avatar{width:84px;height:84px;margin:-42px 0 0 22px;border-radius:50%;background:#fff;border:4px solid #fff;display:grid;place-items:center;font-size:2rem;font-weight:800;box-shadow:0 2px 8px rgba(0,0,0,.12)}
img.avatar{object-fit:cover;display:block}
.info{padding:10px 22px 4px}
.nm{font-size:1.5rem;font-weight:800;margin:0}
.ttl{margin:2px 0 0;font-weight:600}
.org{margin:0;color:var(--mute)}
.vb{display:inline-block;margin-top:8px;font-size:.78rem;font-weight:700;color:#1b7a4b;background:#E7F6EE;padding:2px 10px;border-radius:999px}
.bio{margin:12px 0 0;white-space:pre-wrap}
.det{padding:10px 22px 0;color:var(--mute);font-size:.92rem}
.det div{margin-top:2px;word-break:break-all}
.acts{padding:18px 22px 22px;display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.acts .save{grid-column:1/-1;padding:14px;color:#fff;font-weight:800;font-size:1.05rem}
.acts a,.acts button.s{display:block;text-align:center;padding:10px 4px;background:#F3F4F7;color:var(--ink);text-decoration:none;font-size:.85rem;border-radius:12px;font-weight:600}
.acts .off{opacity:.4;pointer-events:none}
.empty{text-align:center;color:var(--mute);margin:40px 0}
#prevh{font-size:.85rem;color:var(--mute);margin:20px 0 8px}
#qrm{position:fixed;inset:0;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:24px;z-index:9}
#qrm svg{width:min(80vw,340px);height:auto}
#qrm b{font-size:1.3rem}
#toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:999px;font-size:.9rem;max-width:90%;z-index:10}
.foot{text-align:center;margin-top:20px}
.foot a{color:var(--mute)}
</style>
</head>
<body>
<div class="wrap">

<!-- 이메일 인증 -->
<section id="verify" class="view hide">
  <h1>한장</h1>
  <p class="sub">이메일 인증을 하면 내 명함을 만들 수 있어요. 비밀번호는 필요 없어요.</p>
  <div class="box">
    <div id="s1">
      <label for="vem">이메일</label>
      <input class="f" id="vem" type="email" autocomplete="email" placeholder="name@company.com">
      <button class="btn" id="vsend">인증 코드 받기</button>
    </div>
    <div id="s2" class="hide">
      <p class="hint" id="vinfo" style="margin:0 0 12px"></p>
      <label for="vcode">인증 코드</label>
      <input class="f" id="vcode" inputmode="numeric" autocomplete="one-time-code" maxlength="8">
      <button class="btn" id="vgo">확인</button>
      <button class="link" id="vback">이메일 다시 입력</button>
    </div>
    <p class="err" id="vm" role="alert"></p>
  </div>
  <p class="hint">인증한 이메일이 명함에 표시되고 '인증됨' 표시가 붙어요. 다른 사람의 이메일로는 명함을 만들 수 없어요.</p>
</section>

<!-- 만들기 / 수정 -->
<section id="form" class="view hide">
  <h1>내 명함</h1>
  <div class="who"><span>✔ 인증된 이메일 <b id="who"></b></span><button id="lo">로그아웃</button></div>
  <div class="box">
    <label>프로필 사진</label>
    <div class="row2">
      <label class="btn alt" for="photo">사진 선택</label>
      <button class="btn alt" id="pclear" type="button">사진 지우기</button>
    </div>
    <input id="photo" type="file" accept="image/*" class="hide">
    <label for="name">이름 *</label><input class="f" id="name" maxlength="30" autocomplete="name">
    <div class="row2" style="margin:0">
      <div><label for="company">회사</label><input class="f" id="company" maxlength="50" autocomplete="organization"></div>
      <div><label for="department">부서</label><input class="f" id="department" maxlength="40"></div>
    </div>
    <label for="title">직책</label><input class="f" id="title" maxlength="40" autocomplete="organization-title">
    <label for="phone">휴대폰</label><input class="f" id="phone" type="tel" maxlength="20" placeholder="010-1234-5678" autocomplete="tel">
    <label for="email">이메일 (인증된 주소로 고정)</label><input class="f" id="email" readonly>
    <label for="website">웹사이트</label><input class="f" id="website" maxlength="200" placeholder="https://">
    <label for="bio">한 줄 소개</label><textarea class="f" id="bio" rows="2" maxlength="120"></textarea>
    <label>명함 색상</label>
    <div class="sw" id="sw"></div>
    <p class="err" id="fm" role="alert"></p>
    <button class="btn" id="go">명함 만들기</button>
    <a class="btn alt hide" id="view" style="margin-top:8px">내 명함 보기</a>
    <p class="hint">명함은 링크를 아는 사람 누구나 볼 수 있어요. 공개하고 싶은 정보만 입력하세요.</p>
  </div>
  <p id="prevh">미리보기</p>
  <div id="prev"></div>
</section>

<!-- 명함 보기 -->
<section id="cardv" class="view hide">
  <div id="cardBox"><p class="empty">명함을 불러오는 중...</p></div>
  <div class="box hide" id="own" style="margin-top:16px">
    <a class="btn alt" id="oEdit" href="./">수정하기</a>
    <button class="link" id="oDel">명함 삭제</button>
  </div>
  <p class="foot"><a href="./">나도 명함 만들기</a></p>
</section>
</div>

<div id="qrm" class="hide" role="dialog" aria-label="QR 코드"></div>
<div id="toast" class="hide" role="status"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
<script>
// ===== Supabase 연결 정보 =====
const SUPABASE_URL = 'https://iorgunigdmkseookjegc.supabase.co';
const SUPABASE_KEY = 'sb_publishable_A4pM2sB4eMqHnGOSmsV0zw_9TQgY_JU';
// ==============================
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const $ = id => document.getElementById(id);
const COLORS = ['#2F5BEA', '#0E9F6E', '#E5484D', '#7C3AED', '#F59E0B', '#1F2937'];
const FIELDS = ['name', 'title', 'company', 'department', 'phone', 'website', 'bio'];
const BASE = location.protocol.startsWith('http') ? location.origin + location.pathname : '';
const P = new URLSearchParams(location.search);
const cardSlug = P.get('c') || (location.pathname.match(/^\/c\/([a-z0-9]+)/) || [])[1];
let user = null, myCard = null, color = 0, photoBlob = null, photoCleared = false, previewUrl = '', pending = '';
const pubPhoto = p => p ? SUPABASE_URL + '/storage/v1/object/public/avatars/' + p : '';

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  return e;
}
function toast(t) {
  const e = $('toast');
  e.textContent = t;
  e.classList.remove('hide');
  clearTimeout(toast.t);
  toast.t = setTimeout(() => e.classList.add('hide'), 2500);
}
function show(id) { document.querySelectorAll('.view').forEach(v => v.classList.toggle('hide', v.id !== id)); }
const safeUrl = u => /^https?:\/\//i.test(u || '') ? u : '';
const shareUrl = s => BASE + '?c=' + s;

/* ---------- 연락처(vCard) / QR / 공유 ---------- */
function vcard(c) {
  const e = s => String(s || '').replace(/\\/g, '\\\\').replace(/\r?\n/g, '\\n').replace(/,/g, '\\,').replace(/;/g, '\\;');
  const L = ['BEGIN:VCARD', 'VERSION:3.0', 'N:' + e(c.name) + ';;;;', 'FN:' + e(c.name)];
  if (c.company || c.department) L.push('ORG:' + e(c.company) + (c.department ? ';' + e(c.department) : ''));
  if (c.title) L.push('TITLE:' + e(c.title));
  if (c.phone) L.push('TEL;TYPE=CELL:' + e(c.phone));
  if (c.email) L.push('EMAIL;TYPE=INTERNET:' + e(c.email));
  if (safeUrl(c.website)) L.push('URL:' + c.website);
  if (c.bio) L.push('NOTE:' + e(c.bio));
  L.push('END:VCARD');
  return L.join('\r\n');
}
function saveContact(c) {
  const url = URL.createObjectURL(new Blob([vcard(c)], { type: 'text/vcard;charset=utf-8' }));
  const a = el('a');
  a.href = url;
  a.download = (c.name || 'contact') + '.vcf';
  document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 3000);
}
function qrSvg(text) {
  const q = qrcode(0, 'M');
  q.addData(text); q.make();
  const n = q.getModuleCount();
  let d = '';
  for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) if (q.isDark(r, c)) d += 'M' + c + ' ' + r + 'h1v1h-1z';
  return '<svg xmlns="http://www.w3.org/2000/svg" viewBox="-2 -2 ' + (n + 4) + ' ' + (n + 4) +
    '" shape-rendering="crispEdges" role="img" aria-label="명함 QR 코드"><rect x="-2" y="-2" width="' + (n + 4) + '" height="' + (n + 4) +
    '" fill="#fff"/><path d="' + d + '" fill="#000"/></svg>';
}
function showQr(c, s) {
  if (!s) return toast('명함을 만든 뒤에 QR을 볼 수 있어요.');
  if (!BASE) return toast('배포한 주소에서 열어야 QR이 정상 동작해요.');
  const m = $('qrm');
  m.innerHTML = qrSvg(shareUrl(s));
  m.append(el('b', '', c.name || ''), el('span', '', '카메라로 스캔하면 내 명함이 열려요'));
  const x = el('button', 'btn alt', '닫기');
  x.style.maxWidth = '200px';
  x.onclick = () => m.classList.add('hide');
  m.append(x);
  m.classList.remove('hide');
}
async function share(c, s) {
  if (!s) return toast('명함을 만든 뒤에 공유할 수 있어요.');
  if (!BASE) return toast('배포한 주소에서 열어야 공유 링크가 만들어져요.');
  const url = shareUrl(s);
  try {
    if (navigator.share) return await navigator.share({ title: c.name + ' 명함', url });
    await navigator.clipboard.writeText(url);
    toast('링크를 복사했어요.');
  } catch (e) { /* 공유 창을 닫은 경우 */ }
}

/* ---------- 명함 그리기 (미리보기와 공개 페이지가 같이 씀) ---------- */
function renderCard(box, c, s) {
  box.textContent = '';
  const col = COLORS[c.color || 0];
  const card = el('div', 'card');
  const band = el('div', 'band'); band.style.background = col;
  const initial = () => { const a = el('div', 'avatar', [...(c.name || '?')][0]); a.style.color = col; return a; };
  let av = initial();
  if (c.photoUrl) {
    const img = el('img', 'avatar');
    img.src = c.photoUrl; img.alt = (c.name || '') + ' 사진';
    img.onerror = () => img.replaceWith(initial());
    av = img;
  }
  const info = el('div', 'info');
  info.append(el('p', 'nm', c.name || '이름'));
  if (c.title) info.append(el('p', 'ttl', c.title));
  const org = [c.company, c.department].filter(Boolean).join(' · ');
  if (org) info.append(el('p', 'org', org));
  if (c.email) info.append(el('span', 'vb', '✔ 이메일 인증'));
  if (c.bio) info.append(el('p', 'bio', c.bio));
  const det = el('div', 'det');
  if (c.phone) det.append(el('div', '', '📞 ' + c.phone));
  if (c.email) det.append(el('div', '', '✉️ ' + c.email));
  if (safeUrl(c.website)) det.append(el('div', '', '🔗 ' + c.website));
  const acts = el('div', 'acts');
  const sv = el('button', 'save', '연락처 저장'); sv.style.background = col;
  sv.onclick = () => saveContact(c);
  const tel = el('a', c.phone ? '' : 'off', '전화'); if (c.phone) tel.href = 'tel:' + c.phone.replace(/[^0-9+]/g, '');
  const mail = el('a', c.email ? '' : 'off', '메일'); if (c.email) mail.href = 'mailto:' + c.email;
  const sh = el('button', 's', '공유'); sh.onclick = () => share(c, s);
  const qr = el('button', 's', 'QR'); qr.onclick = () => showQr(c, s);
  acts.append(sv, tel, mail, sh, qr);
  card.append(band, av, info, det, acts);
  box.append(card);
}

/* ---------- 명함 보기 ---------- */
async function showCard(s) {
  show('cardv');
  const { data, error } = await sb.rpc('get_card', { p_slug: s });
  const c = data && data[0];
  const box = $('cardBox');
  if (error || !c) { box.textContent = ''; box.append(el('p', 'empty', '명함을 찾을 수 없어요. 링크를 다시 확인해 주세요.')); return; }
  document.title = c.name + ' · 명함';
  c.photoUrl = pubPhoto(c.photo_path);
  renderCard(box, c, s);
  $('own').classList.toggle('hide', !c.is_mine);
  $('oDel').onclick = async () => {
    if (!confirm('명함을 삭제할까요? 되돌릴 수 없어요.')) return;
    const { error } = await sb.from('cards').delete().eq('slug', s);
    if (error) return toast('삭제하지 못했어요.');
    if (c.photo_path) sb.storage.from('avatars').remove([c.photo_path]);
    location.href = location.pathname;
  };
}

/* ---------- 이메일 인증 (비밀번호 없이 메일로 받은 코드) ---------- */
const vmsg = t => { $('vm').textContent = t; };
function resetVerify() {
  $('s2').classList.add('hide'); $('s1').classList.remove('hide');
  $('vsend').disabled = false; $('vcode').value = ''; vmsg('');
}
$('vsend').onclick = async () => {
  const em = $('vem');
  if (!em.value.trim() || !em.checkValidity()) return vmsg('이메일 주소를 확인해 주세요.');
  $('vsend').disabled = true; vmsg('');
  const { error } = await sb.auth.signInWithOtp({ email: em.value.trim(), options: { shouldCreateUser: true } });
  if (error) { vmsg('인증 코드를 보내지 못했어요. 잠시 후 다시 시도해 주세요.'); $('vsend').disabled = false; return; }
  pending = em.value.trim();
  $('s1').classList.add('hide'); $('s2').classList.remove('hide');
  $('vinfo').textContent = pending + '(으)로 인증 코드를 보냈어요. 메일함과 스팸함을 확인해 주세요.';
};
$('vgo').onclick = async () => {
  const token = $('vcode').value.trim();
  if (!token) return;
  $('vgo').disabled = true; vmsg('');
  const { data, error } = await sb.auth.verifyOtp({ email: pending, token, type: 'email' });
  $('vgo').disabled = false;
  if (error || !data.session) return vmsg('코드가 맞지 않거나 만료됐어요. 다시 확인해 주세요.');
  user = data.session.user; showForm();
};
$('vback').onclick = resetVerify;
$('lo').onclick = async () => { await sb.auth.signOut(); user = null; myCard = null; resetVerify(); show('verify'); };

/* ---------- 만들기 / 수정 + 사진 ---------- */
function readForm() {
  const v = { color, email: user ? user.email : null };
  FIELDS.forEach(f => { const t = $(f).value.trim(); v[f] = f === 'name' ? t : (t || null); });
  if (v.website && !/^https?:\/\//i.test(v.website)) v.website = 'https://' + v.website;
  v.photoUrl = photoCleared ? '' : (previewUrl || pubPhoto(myCard && myCard.photo_path));
  return v;
}
const preview = () => renderCard($('prev'), readForm(), myCard && myCard.slug);
function drawSwatches() {
  const box = $('sw');
  box.textContent = '';
  COLORS.forEach((c, i) => {
    const b = el('button', i === color ? 'on' : '');
    b.type = 'button'; b.style.background = c; b.setAttribute('aria-label', '색상 ' + (i + 1));
    b.onclick = () => { color = i; drawSwatches(); preview(); };
    box.append(b);
  });
}
// 사진을 400x400 정사각형으로 잘라 줄여서 올려요 (용량 절약)
function resize(file) {
  return new Promise((ok, no) => {
    const img = new Image(), u = URL.createObjectURL(file);
    img.onload = () => {
      const S = 400, c = document.createElement('canvas');
      c.width = c.height = S;
      const m = Math.min(img.width, img.height);
      c.getContext('2d').drawImage(img, (img.width - m) / 2, (img.height - m) / 2, m, m, 0, 0, S, S);
      URL.revokeObjectURL(u);
      c.toBlob(b => b ? ok(b) : no(new Error('blob')), 'image/jpeg', 0.85);
    };
    img.onerror = () => { URL.revokeObjectURL(u); no(new Error('img')); };
    img.src = u;
  });
}
$('photo').onchange = async e => {
  const f = e.target.files[0];
  e.target.value = '';
  if (!f) return;
  if (f.size > 15 * 1024 * 1024) return toast('사진이 너무 커요. 15MB 이하로 골라 주세요.');
  try {
    photoBlob = await resize(f); photoCleared = false;
    if (previewUrl) URL.revokeObjectURL(previewUrl);
    previewUrl = URL.createObjectURL(photoBlob); preview();
  } catch (err) { toast('사진을 불러오지 못했어요. 다른 사진을 골라 주세요.'); }
};
$('pclear').onclick = () => { photoBlob = null; previewUrl = ''; photoCleared = true; preview(); };

async function showForm() {
  show('form');
  $('who').textContent = user.email;
  const { data } = await sb.from('cards').select('*').eq('user_id', user.id).maybeSingle();
  myCard = data;
  FIELDS.forEach(f => $(f).value = (myCard && myCard[f]) || '');
  $('email').value = user.email;
  color = myCard ? myCard.color : 0;
  photoBlob = null; photoCleared = false; previewUrl = '';
  $('go').textContent = myCard ? '저장하기' : '명함 만들기';
  $('view').classList.toggle('hide', !myCard);
  if (myCard) $('view').href = '?c=' + myCard.slug;
  drawSwatches(); preview();
}
$('form').addEventListener('input', preview);
$('go').onclick = async () => {
  const v = readForm(), m = $('fm');
  m.textContent = '';
  if (!v.name) { m.textContent = '이름을 입력해 주세요.'; return; }
  $('go').disabled = true;
  const oldPath = myCard && myCard.photo_path;
  try {
    let path = photoCleared ? null : oldPath || null;
    if (photoBlob) {
      path = user.id + '/' + Date.now() + '.jpg';
      const up = await sb.storage.from('avatars').upload(path, photoBlob, { contentType: 'image/jpeg' });
      if (up.error) throw up.error;
    }
    const { data, error } = await sb.rpc('save_card', {
      p_name: v.name, p_title: v.title, p_company: v.company, p_department: v.department,
      p_phone: v.phone, p_website: v.website, p_bio: v.bio, p_color: v.color, p_photo: path
    });
    if (error) throw error;
    if (oldPath && oldPath !== path) sb.storage.from('avatars').remove([oldPath]);   // 이전 사진 정리
    location.href = '?c=' + data[0].out_slug;
  } catch (e) {
    console.error(e);
    m.textContent = '저장하지 못했어요. 입력 내용을 확인하고 다시 시도해 주세요.';
    $('go').disabled = false;
  }
};

/* ---------- 시작 ---------- */
(async () => {
  if (cardSlug) return showCard(cardSlug);   // 명함 보기는 인증 없이 가능해요
  const { data } = await sb.auth.getSession();
  if (data.session) { user = data.session.user; showForm(); } else show('verify');
})();
</script>
